<html>
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <title>Vue.js Pet Store</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    </head>
    
    <body>
        <div id="app">
            <header>
                <h1 v-text="sitename"></h1>
                
                <button v-on:click="showCheckout">
                    {{ cartItemCount }}
                    <span class="fas fa-cart-plus"></span>
                    Checkout
                </button>
            </header>

            <main>
                <div v-if="showProduct">
                    <figure>
                        <img v-bind:src="product.image">
                    </figure>
                    <h2 v-text="product.name"></h2>
                    <p v-text="product.description"></p>
                    <p>
                        Price: ${{ product.price }}
                    </p>
                    
                    <button v-on:click="addItem" v-if="canAddtoCart">
                        Add to Cart
                    </button>

                    <button disabled="disabled" v-else>
                        Out of Stock
                    </button>

                </div>
                <div v-else>
                    Checkout Page
                    <p>
                        <strong>First Name:</strong>
                        <input v-model.trim="order.firstName"/>
                    </p>
                    <p>
                        <strong>Last Name:</strong>
                        <input v-model="order.lastName"/>
                    </p>
                    <p>
                        <strong>Address:</strong>
                        <input v-model="order.address"/>
                    </p>
                    <p>
                        <strong>City:</strong>
                        <input v-model="order.city"/>
                    </p>
                    <p>
                        <strong>State:</strong>
                        <select v-model="order.state" class="form-control">
                        <option disabled value="">State</option>
                            <option v-bind:value="states.AL">AL</option>
                            <option v-bind:value="states.AR">AR</option>
                            <option v-bind:value="states.CA">CA</option>
                            <option v-bind:value="states.NV">NV</option>
                        </select>
                    </p>
                    <p>
                        <strong>Zip:</strong>
                        <input v-model.number="order.zip" type="number"/>
                    </p>
                    <p>
                        <input type="checkbox" id="gift"
                        v-model="order.gift"
                        v-bind:true-value="order.sendGift"
                        v-bind:false-value="order.dontSendGift"/>
                        <label for="gift">Send as Gift</label>
                    </p>

                        <input type="radio" id="home" value="Home" v-model="order.method">
                        <label for="home">Home </label>

                        <input type="radio" id="business" value="Business" v-model="order.method">
                        <label for="business">Business </label>

                    <h2>Order Information</h2>
                    <p>First Name:{{order.firstName}}</p>
                    <p>Last Name:{{order.lastName}}</p>
                    <p>Address:{{order.address}}</p>
                    <p>City:{{order.city}}</p>
                    <p>State:{{order.state}}</p>
                    <p>Zip:{{order.zip}}</p>
                    <p>Method:{{order.method}}</p>

                    <button v-on:click="submitForm">Place Order</button>
                </div>
            </main>
        </div>
        <script type="text/javascript">
            var webstore = new Vue({
                el: '#app',
                data: {
                    sitename: 'Vue.js Pet Store',
                    product: {
                        id: 1001,
                        name: 'Cat Food, 25lb Bag',
                        description: 'A 25 pound bag of <em>irresistible</em>, organic goodness for your cat.',
                        price: 2000,
                        image: 'images/product-fullsize.png',
                        availableInventory: 5
                    },
                    showProduct: true,
                    cart: [],
                    order: {
                        firstName: '',
                        lastName: '',
                        address: '',
                        city: '',
                        state: '',
                        zip: '',
                        method: '',
                        gift: 'Do not send as Gift',
                        sendGift: 'Send as Gift',
                        dontSendGift: 'Do not send as Gift' 
                    },
                    states: {
                        AL: 'Alabama',
                        AR: 'Arkansas',
                        CA: 'California',
                        NV: 'Nevada'
                    }
                },
                methods: {
                    addItem: function() {
                        this.cart.push(this.product.id);
                    },
                    showCheckout: function() {
                        this.showProduct = this.showProduct ? false : true;
                    },
                    submitForm: function() {
                        alert('Order Submitted!');
                    }
                },
                computed: {
                    cartItemCount: function() {
                        return this.cart.length;
                    },
                    canAddtoCart: function() {
                        return this.product.availableInventory > this.cartItemCount;
                    }
                }
            });
        </script>
    </body>
</html>
